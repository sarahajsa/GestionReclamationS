<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mémos agence — Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="../assets/img/logo-bmce.png" alt="Bank of Africa — BMCE Group" class="logo-img">
        </div>
      </div>
      <div class="sidebar-user">
<div class="user-avatar" id="sidebar-user-avatar">A1</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">Admin 1</div>
          <div class="user-role" id="sidebar-user-role">Administrateur</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Administration</div>
        <ul>
<li class="nav-item">
            <a href="dashboard.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Tableau de bord</a>
          </li>
          <li class="nav-item">
            <a href="reclamations.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Réclamations</a>
          </li>
          <li class="nav-item active">
            <a href="memo.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Mémos agence</a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <a href="#" id="btn-logout" class="btn btn-ghost">↩ Déconnexion</a>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <button class="menu-toggle">☰</button>
        <h1 class="topbar-title">Mémos — Communication agence</h1>
      </header>

      <div class="page-content">
        <div class="filters-bar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-memo" placeholder="Rechercher par référence ou contenu...">
          </div>
          <select class="filter-select" id="filter-role">
            <option value="">Tous les émetteurs</option>
            <option value="admin">Administration</option>
            <option value="agence">Agence</option>
          </select>
          <select class="filter-select" id="filter-agence"><option value="">Toutes les agences</option></select>
          <select class="filter-select" id="filter-memo-statut">
            <option value="">Tous les statuts</option><option value="nouveau">Nouveau</option><option value="encours">En cours</option><option value="attente">En attente</option><option value="resolu">Résolu</option><option value="rejete">Rejeté</option>
          </select>
          <select class="filter-select" id="filter-memo-gravite">
            <option value="">Toutes les gravités</option><option value="basse">Basse</option><option value="moyenne">Moyenne</option><option value="haute">Haute</option><option value="critique">Critique</option>
          </select>
        </div>

        <div id="memos-container"></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script type="module">
    const session = App.requireAuth(['admin']);
    if (!session) throw new Error('Unauthorized');

    const recs = await App.loadReclamations();
    document.getElementById('filter-memo-statut').innerHTML = '<option value="">Tous les statuts</option><option value="attente">En attente</option><option value="encours">En cours</option><option value="prise_charge">Prise en charge</option><option value="demande_supplementaire">Demande supplémentaire</option><option value="resolu">Résolue</option><option value="cloture">Clôturée</option>';
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));

    function getAllMemos() {
      const all = [];
      recs.forEach(rec => {
        rec.memos.forEach(m => {
          all.push({ ...m, reference: rec.reference, objet: rec.objet, statut: rec.statut, statut_label: rec.statut_label, gravite: rec.gravite, agence: m.role === 'agence' ? m.auteur : '' });
        });
      });
      return all.sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function renderMemos() {
      const q = document.getElementById('search-memo').value.toLowerCase();
      const roleFilter = '';
      const agenceFilter = '';
      const statutFilter = document.getElementById('filter-memo-statut').value;
      const graviteFilter = document.getElementById('filter-memo-gravite').value;
      let memos = getAllMemos();

      if (q) {
        memos = memos.filter(m =>
          m.reference.toLowerCase().includes(q) ||
          m.message.toLowerCase().includes(q) ||
          m.auteur.toLowerCase().includes(q)
        );
      }
      if (roleFilter) {
        memos = memos.filter(m => m.role === roleFilter);
      }
      if (agenceFilter) memos = memos.filter(m => m.agence === agenceFilter);
      if (statutFilter) memos = memos.filter(m => m.statut === statutFilter);
      if (graviteFilter) memos = memos.filter(m => m.gravite === graviteFilter);

      const container = document.getElementById('memos-container');

      if (memos.length === 0) {
        container.innerHTML = `
          <div class="card"><div class="card-body">
            <div class="empty-state">
              <div class="empty-state-icon">💬</div>
              <h3>Aucun mémo</h3>
              <p>Les échanges entre l'administration et les agences apparaîtront ici.</p>
            </div>
          </div></div>`;
        return;
      }

      const groups = [...new Map(memos.map(m => [m.reference, {
        reference: m.reference, objet: m.objet, statut: m.statut, statut_label: m.statut_label || App.getStatutLabel(m.statut), memos: []
      }])).values()];
      memos.forEach(m => groups.find(group => group.reference === m.reference).memos.push(m));

      container.innerHTML = `<div class="card memo-list-card"><div class="table-wrap"><table class="memo-reclamations-table">
        <thead><tr><th>Réclamation</th><th>Objet</th><th>Statut</th><th>Nombre de mémos</th><th></th></tr></thead>
        <tbody>${groups.map(group => `
          <tr class="memo-reclamation-row" data-reference="${esc(group.reference)}">
            <td><a href="detail.html?ref=${encodeURIComponent(group.reference)}" class="ref-link">${esc(group.reference)}</a></td>
            <td>${esc(group.objet)}</td>
            <td><span class="badge ${App.getStatutBadge(group.statut)}">${esc(group.statut_label)}</span></td>
            <td><span class="badge badge-encours">${group.memos.length} mémo${group.memos.length > 1 ? 's' : ''}</span></td>
            <td><button type="button" class="memo-expand-button" data-toggle-memos="${esc(group.reference)}" aria-expanded="false" title="Afficher les mémos">+</button></td>
          </tr>
          <tr class="memo-details-row" data-details="${esc(group.reference)}" hidden><td colspan="5"><div class="memo-details-list">
            ${group.memos.map(m => `<article class="memo-entry"><div class="memo-entry-header"><span class="badge badge-${m.role === 'admin' ? 'encours' : 'attente'}">${m.role === 'admin' ? 'Administration' : 'Agence'}</span><span class="timeline-date">${App.formatDateTime(m.date)}</span></div><div class="memo-entry-message">${esc(m.message)}</div></article>`).join('')}
          </div></td></tr>
        `).join('')}</tbody>
      </table></div></div>`;

      container.querySelectorAll('[data-toggle-memos]').forEach(button => button.addEventListener('click', () => {
        const reference = button.dataset.toggleMemos;
        const details = container.querySelector(`[data-details="${CSS.escape(reference)}"]`);
        const expanded = button.getAttribute('aria-expanded') === 'true';
        details.hidden = expanded;
        button.setAttribute('aria-expanded', String(!expanded));
        button.textContent = expanded ? '+' : '−';
        button.title = expanded ? 'Afficher les mémos' : 'Masquer les mémos';
      }));
    }

    const agencySelect = document.getElementById('filter-agence');
    [...new Set(getAllMemos().map(m => m.agence).filter(Boolean))].sort().forEach(agence => {
      agencySelect.insertAdjacentHTML('beforeend', `<option value="${agence}">${agence}</option>`);
    });
    document.getElementById('search-memo').addEventListener('input', renderMemos);
    ['filter-role', 'filter-agence', 'filter-memo-statut', 'filter-memo-gravite'].forEach(id => document.getElementById(id).addEventListener('change', renderMemos));
    renderMemos();
  </script>
</body>
</html>
