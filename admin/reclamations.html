<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des réclamations — Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="../assets/img/logo-bmce.png" alt="Bank of Africa — BMCE Group" class="logo-img">
        </div>
      </div>
      <div class="sidebar-user">
<div class="user-avatar" id="sidebar-user-avatar">A1</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">Admin 1</div>
          <div class="user-role" id="sidebar-user-role">Administrateur</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Administration</div>
        <ul>
<li class="nav-item">
            <a href="dashboard.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Tableau de bord</a>
          </li>
          <li class="nav-item active">
            <a href="reclamations.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Réclamations</a>
          </li>
          <li class="nav-item">
            <a href="memo.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Mémos agence</a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <a href="#" id="btn-logout" class="btn btn-ghost">↩ Déconnexion</a>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <button class="menu-toggle">☰</button>
        <h1 class="topbar-title">Gestion des réclamations</h1>
      </header>

      <div class="page-content">
        <div class="filters-bar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Rechercher par référence, client, objet...">
          </div>
          <select class="filter-select" id="filter-statut">
            <option value="">Tous statuts</option>
            <option value="attente">En attente</option>
            <option value="encours">En cours</option>
            <option value="prise_charge">Prise en charge</option>
            <option value="demande_supplementaire">Demande supplémentaire</option>
            <option value="resolu">Résolue</option>
            <option value="cloture">Clôturée</option>
          </select>
          <select class="filter-select" id="filter-gravite">
            <option value="">Toutes priorités</option>
            <option value="basse">Basse</option>
            <option value="moyenne">Moyenne</option>
            <option value="haute">Haute</option>
            <option value="critique">Critique</option>
          </select>
          <select class="filter-select" id="filter-type">
            <option value="">Tous types</option>
            <option value="credit_immobilier">Crédit immobilier</option>
            <option value="credit_auto">Crédit auto</option>
            <option value="credit_conso">Crédit consommation</option>
            <option value="credit_professionnel">Crédit professionnel</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Liste des réclamations</h2>
            <span id="result-count" style="font-size:13px; color:var(--text-muted);"></span>
          </div>
          <div class="card-body" style="padding:0;">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Référence</th>
                    <th>Client</th>
                    <th>Objet</th>
                    <th>Type</th>
                    <th>Priorité</th>
                    <th>Statut</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="reclamations-table"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script type="module">
    const session = App.requireAuth(['admin']);
    if (!session) throw new Error('Unauthorized');

    const recs = await App.loadReclamations();
    function renderTable() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const statut = document.getElementById('filter-statut').value;
      const gravite = document.getElementById('filter-gravite').value;
      const type = document.getElementById('filter-type').value;

      const filtered = recs.filter(r => {
        const matchSearch = !q ||
          r.reference.toLowerCase().includes(q) ||
          r.objet.toLowerCase().includes(q) ||
          r.nom.toLowerCase().includes(q) ||
          r.prenom.toLowerCase().includes(q);
        const matchStatut = !statut || r.statut === statut;
        const matchGravite = !gravite || r.gravite === gravite;
        const matchType = !type || r.type === type;
        return matchSearch && matchStatut && matchGravite && matchType;
      });

      document.getElementById('result-count').textContent = `${filtered.length} résultat(s)`;

      const tbody = document.getElementById('reclamations-table');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><p>Aucune réclamation ne correspond aux filtres.</p></div></td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => `
        <tr>
          <td><a href="detail.html?ref=${r.reference}" class="ref-link">${r.reference}</a></td>
          <td>${r.prenom} ${r.nom}</td>
          <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${r.objet}</td>
          <td>${r.type_label}</td>
          <td><span class="badge ${App.getGraviteBadge(r.gravite)}">${r.gravite_label}</span></td>
          <td><span class="badge ${App.getStatutBadge(r.statut)}">${r.statut_label}</span></td>
          <td>${App.formatDate(r.date_creation)}</td>
        </tr>
      `).join('');
    }

    ['search-input', 'filter-statut', 'filter-gravite', 'filter-type'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderTable);
      document.getElementById(id).addEventListener('change', renderTable);
    });

    renderTable();
  </script>
</body>
</html>
