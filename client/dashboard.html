<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tableau de bord - Client</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-header"><img src="../assets/img/logo-bmce.png" alt="BMCE" class="logo-img"></div><div class="sidebar-user"><div class="user-avatar" id="sidebar-user-avatar">C1</div><div class="user-info"><div class="user-name" id="sidebar-user-name">Client</div><div class="user-role" id="sidebar-user-role">Client</div></div></div><nav class="sidebar-nav"><div class="nav-section">Menu</div><ul><li class="nav-item active"><a href="dashboard.html"><span class="nav-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Tableau de bord</a></li><li class="nav-item"><a href="deposer.html"><span class="nav-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span> Déposer réclamation</a></li></ul></nav><div class="sidebar-footer"><a href="#" id="btn-logout" class="btn btn-ghost">↩ Déconnexion</a></div></aside><main class="main-content"><header class="topbar"><button class="menu-toggle">☰</button><h1 class="topbar-title">Tableau de bord</h1></header><div class="page-content"><div class="stats-grid" id="client-stats"></div><div class="card"><div class="card-header"><h2>Liste des réclamations</h2><a href="deposer.html" class="btn btn-accent btn-sm">+ Nouvelle réclamation</a></div><div class="card-body" style="padding:0"><div class="table-wrap"><table><thead><tr><th>Référence</th><th>Objet</th><th>Gravité</th><th>Statut</th><th>Date</th><th>Actions</th></tr></thead><tbody id="recent-reclamations"></tbody></table></div></div></div></div></main></div><script src="../assets/js/app.js"></script><script type="module">
const session=App.requireAuth(['client']);if(!session)throw new Error('Unauthorized');const recs=(await App.loadReclamations()).filter(r=>Number(r.client_id)===Number(session.id));document.getElementById('client-stats').innerHTML=`<div class="stat-card"><div><div class="stat-value">${recs.length}</div><div class="stat-label">Total réclamations</div></div></div><div class="stat-card"><div><div class="stat-value">${recs.filter(r=>['nouveau','encours'].includes(r.statut)).length}</div><div class="stat-label">En cours</div></div></div><div class="stat-card"><div><div class="stat-value">${recs.filter(r=>r.statut==='resolu').length}</div><div class="stat-label">Résolues</div></div></div>`;const tbody=document.getElementById('recent-reclamations');if(!recs.length)tbody.innerHTML='<tr><td colspan="6"><div class="empty-state"><p>Aucune réclamation pour le moment.</p></div></td></tr>';else{tbody.innerHTML=recs.map(r=>`<tr><td><a href="detail.html?ref=${encodeURIComponent(r.reference)}" class="ref-link">${r.reference}</a></td><td>${r.objet}</td><td><span class="badge ${App.getGraviteBadge(r.gravite)}">${r.gravite_label}</span></td><td><span class="badge ${App.getStatutBadge(r.statut)}">${r.statut_label}</span></td><td>${App.formatDate(r.date_creation)}</td><td><a href="deposer.html?ref=${encodeURIComponent(r.reference)}" class="btn btn-outline btn-sm">Modifier</a> <button class="btn btn-danger btn-sm" data-ref="${r.reference}">Supprimer</button></td></tr>`).join('');tbody.querySelectorAll('[data-ref]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer cette réclamation ?'))return;const res=await App.api('../backend/api/reclamations.php',{method:'POST',body:new URLSearchParams({action:'delete',reference:b.dataset.ref})});const j=await res.json();if(!res.ok)return App.showToast(j.message||'Suppression impossible','error');location.reload()})}
</script></body></html>
