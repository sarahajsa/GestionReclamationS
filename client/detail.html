<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Détail réclamation</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/journey.css"></head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-header"><div class="logo"><img src="../assets/img/logo-bmce.png" alt="Bank of Africa" class="logo-img"></div></div><div class="sidebar-user"><div class="user-avatar" id="sidebar-user-avatar">C1</div><div class="user-info"><div class="user-name" id="sidebar-user-name">Client</div><div class="user-role">Client</div></div></div><nav class="sidebar-nav"><div class="nav-section">Menu</div><ul><li class="nav-item active"><a href="dashboard.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Tableau de bord</a></li><li class="nav-item"><a href="deposer.html"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg> Déposer réclamation</a></li></ul></nav><div class="sidebar-footer"><a href="#" id="btn-logout" class="btn btn-ghost">Déconnexion</a></div></aside><main class="main-content"><header class="topbar"><button class="menu-toggle">☰</button><h1 class="topbar-title">Détail de la réclamation</h1></header><div class="page-content"><a href="dashboard.html" class="btn btn-ghost btn-sm">← Retour</a><div class="detail-grid" style="margin-top:16px"><div><div class="card"><div class="card-header"><h2 id="ref"></h2><span id="status" class="badge"></span></div><div class="card-body"><div class="info-grid"><div class="info-item"><label>Objet</label><span id="objet"></span></div><div class="info-item"><label>Type</label><span id="type"></span></div><div class="info-item"><label>Gravité</label><span id="gravite"></span></div><div class="info-item"><label>Date</label><span id="date"></span></div></div><div class="detail-section"><h3>Chat</h3><div id="chat" class="chat-box"></div><form id="chat-form" class="chat-form"><textarea id="chat-input" class="form-control" rows="2" placeholder="Écrire un message..."></textarea><button class="btn btn-accent btn-sm" type="submit">Envoyer</button></form></div></div></div></div><div class="card journey-card"><div class="card-header"><h3>Parcours de la réclamation</h3></div><div class="card-body"><div class="journey-steps" id="journey"></div></div></div></div></div></main></div><script src="../assets/js/app.js"></script><script type="module">
const s=App.requireAuth(['client']);if(!s)throw new Error('Unauthorized');const ref=new URLSearchParams(location.search).get('ref');const res=await App.api('../backend/api/reclamation_detail.php?ref='+encodeURIComponent(ref));const j=await res.json();if(!res.ok){location.href='dashboard.html';throw new Error(j.message);}const r=j.reclamation;for(const [id,value] of [['ref',r.reference],['objet',r.objet],['type',r.type_label],['gravite',r.gravite_label]])document.getElementById(id).textContent=value;document.getElementById('date').textContent=App.formatDateTime(r.date_creation)+(r.date_modification&&r.date_modification!==r.date_creation?' · Modifiée le '+App.formatDateTime(r.date_modification):'');document.getElementById('status').textContent=r.statut_label;document.getElementById('status').className='badge '+App.getStatutBadge(r.statut);const stages=[['attente','En attente'],['encours','En cours'],['prise_charge','Prise en charge'],['demande_supplementaire','Demande supplémentaire'],['resolu','Résolue'],['cloture','Clôturée']],h=Object.fromEntries(j.history.map(x=>[x.status,x]));document.getElementById('journey').innerHTML=stages.map((x,i)=>`<div class="journey-step ${r.statut===x[0]?'is-current':''} ${h[x[0]]?'is-complete':''}"><span class="journey-marker">${h[x[0]]?'✓':i+1}</span><div class="journey-step-info"><strong>${x[1]}</strong>${h[x[0]]?`<small>${App.formatDateTime(h[x[0]].date)}</small>`:''}</div></div>`).join('');
const esc=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function loadChat(){const x=await(await App.api('../backend/api/messages.php?reference='+encodeURIComponent(ref))).json();document.getElementById('chat').innerHTML=(x.messages||[]).map(m=>`<div class="chat-message ${m.role==='client'?'chat-message-client':'chat-message-admin'}"><div class="chat-meta">${esc(m.auteur)} · ${App.formatDateTime(m.date)}</div><div>${esc(m.message)}</div></div>`).join('')||'<p class="empty-state">Aucun message.</p>';}await loadChat();document.getElementById('chat-form').onsubmit=async e=>{e.preventDefault();const i=document.getElementById('chat-input');if(!i.value.trim())return;const x=await App.api('../backend/api/messages.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ref,message:i.value})});if(x.ok){i.value='';loadChat();}};
</script><script>
const statusJourneyMeta=[['attente','✓'],['encours','✓'],['prise_charge','✓'],['demande_supplementaire','×'],['resolu','✓'],['cloture','✓']];
document.querySelectorAll('#journey .journey-step').forEach((step,index)=>{const meta=statusJourneyMeta[index];if(!meta)return;step.classList.add('status-step-'+meta[0]);const marker=step.querySelector('.journey-marker');if(marker){marker.classList.add('status-marker','status-'+meta[0]);if(step.classList.contains('is-complete'))marker.textContent=meta[1];}});
</script><script>
setTimeout(() => {
  const gravity = document.getElementById('gravite');
  const status = document.getElementById('status');
  const gravityLabel = gravity?.previousElementSibling;
  if (gravityLabel) gravityLabel.textContent = 'Priorité';
  if (gravity && status) {
    const gravityKey = {Basse:'basse',Moyenne:'moyenne',Haute:'haute',Critique:'critique'}[gravity.textContent.trim()];
    if (gravityKey) gravity.className = 'badge ' + App.getGraviteBadge(gravityKey);
  }
});
</script><script>
setTimeout(() => {
  const label = document.querySelector('#gravite')?.previousElementSibling;
  if (label) label.textContent = 'Priorité';
}, 0);
</script></body></html>
